# Regenerate with `task proto` from the repo root. The plugins run through
# `go run`, so no protoc or plugin binaries need installing.
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10"]
    out: .
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1"]
    out: .
    opt: paths=source_relative
